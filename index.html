<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="weather-form">
            <h1 class="weather-form__title">Погода</h1>
            <div class="weather-form__group">
                <label class="weather-form__label">Широта:</label>
                <input class="weather-form__input" type="text" id="latitude" placeholder="56.8439">
            </div>
            <div class="weather-form__group">
                <label class="weather-form__label">Долгота:</label>
                <input class="weather-form__input" type="text" id="longitude" placeholder="60.6538">
            </div>
            <button class="weather-form__button" id="showWeather">Показать погоду</button>
            <div id="errorMessage" class="weather-form__error"></div>
        </div>

        <div class="weather-widgets" id="widgetsContainer"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
